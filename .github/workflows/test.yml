name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oculis_migration_test_ci
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oculis_migration_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce factual-data policy
        run: npm run check:factual

      - name: Lint
        run: npm run lint

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Run tests (all workspaces)
        run: npm test

      - name: Test PGlite migration against native PostgreSQL 16
        env:
          OCULIS_ALLOW_NATIVE_DB_TEST: "1"
          OCULIS_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/oculis_migration_test_ci
        run: npm run test:db-migration:native

      - name: Build
        env:
          # Never connect CI builds to a real database. PGlite is isolated, disposable,
          # and bootstrapped explicitly because Next renders server components at build time.
          DB_DRIVER: pglite
          PGLITE_DIR: ${{ github.workspace }}/.next-ci/pglite
          OCULIS_AUTO_MIGRATE: "1"
        run: npm run build
