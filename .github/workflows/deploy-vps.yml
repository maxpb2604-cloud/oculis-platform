name: Deploy production VPS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or commit to deploy"
        required: true
        default: main
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# GitHub production-environment configuration (values are never printed):
# - Secrets: VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY, VPS_KNOWN_HOSTS.
# - Variables: OCULIS_PUBLIC_URL (HTTPS), optional VPS_SSH_PORT (default 22),
#   and VPS_DEPLOY_ENABLED=true to enable post-CI deployments.
# The dedicated SSH account needs only passwordless sudo permission for
# /usr/local/sbin/oculis-deploy; that server-owned script receives one full SHA.
# Production changes must be applied one at a time. A queued deploy is safer than
# interrupting the remote release script halfway through a migration or restart.
concurrency:
  group: oculis-production-vps
  cancel-in-progress: false

jobs:
  eligibility:
    name: Check deployment eligibility
    # The exact repository check prevents a copied workflow in a fork from using
    # deployment credentials. Update this value deliberately if the repo moves.
    if: >-
      github.repository == 'maxpb2604-cloud/oculis-platform' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target_ref: ${{ steps.preflight.outputs.target_ref }}

    steps:
      - name: Resolve requested Git ref
        id: preflight
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_REF: ${{ inputs.ref }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            target_ref="$MANUAL_REF"
          else
            target_ref="$CI_SHA"
          fi

          if [[ ! "$target_ref" =~ ^[A-Za-z0-9._/-]+$ ]] ||
             [[ "$target_ref" == -* || "$target_ref" == *..* || "$target_ref" == *//* ]]; then
            echo "::error::The requested Git ref is invalid."
            exit 1
          fi

          echo "target_ref=$target_ref" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy and verify production
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      OCULIS_PUBLIC_URL: ${{ vars.OCULIS_PUBLIC_URL }}

    steps:
      - name: Determine whether deployment is enabled
        id: deployment_gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VPS_DEPLOY_ENABLED: ${{ vars.VPS_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" && "$VPS_DEPLOY_ENABLED" != "true" ]]; then
            echo "::notice::Automatic VPS deployment is disabled for the production environment."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify production deployment configuration
        id: configuration
        if: steps.deployment_gate.outputs.enabled == 'true'
        shell: bash
        env:
          VPS_HOST_CONFIGURED: ${{ secrets.VPS_HOST != '' }}
          VPS_USER_CONFIGURED: ${{ secrets.VPS_USER != '' }}
          VPS_KEY_CONFIGURED: ${{ secrets.VPS_SSH_PRIVATE_KEY != '' }}
          VPS_HOST_KEYS_CONFIGURED: ${{ secrets.VPS_KNOWN_HOSTS != '' }}
          PUBLIC_URL_CONFIGURED: ${{ vars.OCULIS_PUBLIC_URL != '' }}
        run: |
          set -euo pipefail

          missing=0
          for required_flag in \
            VPS_HOST_CONFIGURED \
            VPS_USER_CONFIGURED \
            VPS_KEY_CONFIGURED \
            VPS_HOST_KEYS_CONFIGURED \
            PUBLIC_URL_CONFIGURED
          do
            if [[ "${!required_flag:-false}" != "true" ]]; then
              missing=1
            fi
          done
          if (( missing != 0 )); then
            echo "::error::Production deployment configuration is incomplete. Configure the required production secrets and variables."
            exit 1
          fi

      - name: Checkout requested release
        if: steps.deployment_gate.outputs.enabled == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.eligibility.outputs.target_ref }}
          # Full history lets the next step prove that manual rollbacks still
          # belong to main rather than deploying an arbitrary side branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable release SHA
        id: release
        if: steps.deployment_gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          deploy_sha="$(git rev-parse --verify HEAD^{commit})"
          if [[ ! "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checkout did not resolve to a full commit SHA."
            exit 1
          fi
          main_tip="$(git rev-parse --verify refs/remotes/origin/main^{commit})"
          if ! git merge-base --is-ancestor "$deploy_sha" "$main_tip"; then
            echo "::error::Only commits contained in main may be deployed."
            exit 1
          fi
          echo "sha=$deploy_sha" >> "$GITHUB_OUTPUT"

      - name: Install pinned SSH identity and host key
        if: steps.deployment_gate.outputs.enabled == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          DEPLOY_KEY_FILE: ${{ runner.temp }}/oculis-vps-deploy-key
        run: |
          set -euo pipefail

          if [[ ! "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "::error::VPS_USER has an invalid format."
            exit 1
          fi
          if [[ ! "$VPS_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]; then
            echo "::error::VPS_HOST has an invalid format."
            exit 1
          fi
          if [[ ! "$VPS_SSH_PORT" =~ ^[0-9]+$ ]] ||
             (( VPS_SSH_PORT < 1 || VPS_SSH_PORT > 65535 )); then
            echo "::error::VPS_SSH_PORT must be an integer between 1 and 65535."
            exit 1
          fi
          for command_name in curl jq node ssh ssh-keygen; do
            if ! command -v "$command_name" > /dev/null 2>&1; then
              echo "::error::Required runner command is unavailable: $command_name"
              exit 1
            fi
          done
          if ! OCULIS_URL_TO_VALIDATE="$OCULIS_PUBLIC_URL" node --input-type=module -e '
            const raw = process.env.OCULIS_URL_TO_VALIDATE || "";
            try {
              const parsed = new URL(raw);
              if (
                parsed.protocol !== "https:" || parsed.username || parsed.password ||
                parsed.pathname !== "/" || parsed.search || parsed.hash || raw !== parsed.origin
              ) process.exit(1);
            } catch { process.exit(1); }
          '; then
            echo "::error::OCULIS_PUBLIC_URL must be a canonical HTTPS origin without credentials, path, query, fragment, or trailing slash."
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$DEPLOY_KEY_FILE"
          chmod 600 "$DEPLOY_KEY_FILE"

          # The known_hosts value must be captured out of band from the VPS and
          # stored verbatim; never replace this with ssh-keyscan at deploy time.
          ssh-keygen -l -f "$HOME/.ssh/known_hosts" > /dev/null
          ssh-keygen -y -f "$DEPLOY_KEY_FILE" > /dev/null

      - name: Capture current verified public release
        id: previous_release
        if: steps.deployment_gate.outputs.enabled == 'true'
        shell: bash
        env:
          HEALTH_RESPONSE_FILE: ${{ runner.temp }}/oculis-health.json
          READY_RESPONSE_FILE: ${{ runner.temp }}/oculis-ready.json
        run: |
          set -euo pipefail
          public_origin="${OCULIS_PUBLIC_URL%/}"
          previous_sha=""

          # A rollback target is trusted only when both public acceptance
          # endpoints currently describe a complete production release.
          if curl --fail --silent --show-error --output "$HEALTH_RESPONSE_FILE" \
              --connect-timeout 5 --max-time 15 "$public_origin/api/health" &&
             curl --fail --silent --show-error --output "$READY_RESPONSE_FILE" \
              --connect-timeout 5 --max-time 20 "$public_origin/api/ready" &&
             jq -e \
              '.status == "ok" and .service == "oculis-web" and
               (.release | strings | test("^[0-9a-f]{40}$"))' \
              "$HEALTH_RESPONSE_FILE" > /dev/null &&
             jq -e \
              '.status == "ready" and .service == "oculis-web" and
               .database == "postgresql"' \
              "$READY_RESPONSE_FILE" > /dev/null
          then
            previous_sha="$(jq -r '.release' "$HEALTH_RESPONSE_FILE")"
          else
            echo "::notice::No previously verified public release is available as a rollback target."
          fi

          rm -f "$HEALTH_RESPONSE_FILE" "$READY_RESPONSE_FILE"
          echo "sha=$previous_sha" >> "$GITHUB_OUTPUT"

      - name: Run immutable release on VPS
        id: remote_deploy
        if: steps.deployment_gate.outputs.enabled == 'true'
        # A transport interruption can be reported after the trusted remote runner
        # already accepted the release. Always reconcile against the public SHA next.
        continue-on-error: true
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_KEY_FILE: ${{ runner.temp }}/oculis-vps-deploy-key
        run: |
          set -euo pipefail
          ssh \
            -i "$DEPLOY_KEY_FILE" \
            -p "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$VPS_USER@$VPS_HOST" \
            "sudo --non-interactive /usr/local/sbin/oculis-deploy '$DEPLOY_SHA'"

      - name: Verify public health and readiness
        id: public_verification
        if: >-
          always() &&
          steps.deployment_gate.outputs.enabled == 'true' &&
          (steps.remote_deploy.outcome == 'success' ||
          steps.remote_deploy.outcome == 'failure')
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
          REMOTE_DEPLOY_OUTCOME: ${{ steps.remote_deploy.outcome }}
          HEALTH_RESPONSE_FILE: ${{ runner.temp }}/oculis-health.json
          READY_RESPONSE_FILE: ${{ runner.temp }}/oculis-ready.json
        run: |
          set -euo pipefail
          public_origin="${OCULIS_PUBLIC_URL%/}"
          accepted=0
          observed_sha=""

          # Bodies stay in runner-temporary files and are never printed. Acceptance
          # requires exact JSON semantics, including the immutable release SHA.
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --output "$HEALTH_RESPONSE_FILE" \
                --connect-timeout 5 --max-time 15 "$public_origin/api/health" &&
               curl --fail --silent --show-error --output "$READY_RESPONSE_FILE" \
                --connect-timeout 5 --max-time 20 "$public_origin/api/ready" &&
               jq -e \
                '.status == "ready" and .service == "oculis-web" and
                 .database == "postgresql"' \
                "$READY_RESPONSE_FILE" > /dev/null
            then
              candidate_sha="$(jq -r \
                'if .status == "ok" and .service == "oculis-web" and
                 (.release | strings | test("^[0-9a-f]{40}$"))
                 then .release else "" end' \
                "$HEALTH_RESPONSE_FILE")"
              if [[ -n "$candidate_sha" ]]; then
                observed_sha="$candidate_sha"
              fi
              if [[ "$candidate_sha" == "$DEPLOY_SHA" ]]; then
                accepted=1
                break
              fi
            fi
            if (( attempt < 18 )); then
              sleep 5
            fi
          done

          # Do not make a rollback decision from an observation collected early
          # in the propagation window. Take a final healthy snapshot after the
          # requested-SHA retries; it may also catch a just-completed deployment.
          if (( accepted == 0 )); then
            observed_sha=""
            for reconciliation_attempt in {1..3}; do
              if curl --fail --silent --show-error --output "$HEALTH_RESPONSE_FILE" \
                  --connect-timeout 5 --max-time 15 "$public_origin/api/health" &&
                 curl --fail --silent --show-error --output "$READY_RESPONSE_FILE" \
                  --connect-timeout 5 --max-time 20 "$public_origin/api/ready" &&
                 jq -e \
                  '.status == "ready" and .service == "oculis-web" and
                   .database == "postgresql"' \
                  "$READY_RESPONSE_FILE" > /dev/null
              then
                candidate_sha="$(jq -r \
                  'if .status == "ok" and .service == "oculis-web" and
                   (.release | strings | test("^[0-9a-f]{40}$"))
                   then .release else "" end' \
                  "$HEALTH_RESPONSE_FILE")"
                if [[ -n "$candidate_sha" ]]; then
                  observed_sha="$candidate_sha"
                  if [[ "$candidate_sha" == "$DEPLOY_SHA" ]]; then
                    accepted=1
                  fi
                  break
                fi
              fi
              if (( reconciliation_attempt < 3 )); then
                sleep 2
              fi
            done
          fi

          echo "observed_sha=$observed_sha" >> "$GITHUB_OUTPUT"
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          rm -f "$HEALTH_RESPONSE_FILE" "$READY_RESPONSE_FILE"
          if (( accepted == 0 )); then
            echo "::error::The public Oculis endpoints did not accept the requested release."
            exit 1
          fi

          if [[ "$REMOTE_DEPLOY_OUTCOME" == "failure" ]]; then
            echo "::notice::SSH reported a transport failure, but public health and readiness prove that the requested SHA was accepted."
          fi

      - name: Roll back to previous verified release
        id: rollback
        if: >-
          failure() &&
          steps.deployment_gate.outputs.enabled == 'true' &&
          steps.public_verification.outcome == 'failure' &&
          steps.previous_release.outputs.sha != '' &&
          steps.previous_release.outputs.sha != steps.release.outputs.sha &&
          steps.public_verification.outputs.observed_sha != steps.previous_release.outputs.sha
        shell: bash
        env:
          PREVIOUS_SHA: ${{ steps.previous_release.outputs.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_KEY_FILE: ${{ runner.temp }}/oculis-vps-deploy-key
          HEALTH_RESPONSE_FILE: ${{ runner.temp }}/oculis-health.json
          READY_RESPONSE_FILE: ${{ runner.temp }}/oculis-ready.json
        run: |
          set -euo pipefail
          ssh \
            -i "$DEPLOY_KEY_FILE" \
            -p "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$VPS_USER@$VPS_HOST" \
            "sudo --non-interactive /usr/local/sbin/oculis-deploy rollback '$PREVIOUS_SHA'"

          public_origin="${OCULIS_PUBLIC_URL%/}"
          restored=0
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --output "$HEALTH_RESPONSE_FILE" \
                --connect-timeout 5 --max-time 15 "$public_origin/api/health" &&
               curl --fail --silent --show-error --output "$READY_RESPONSE_FILE" \
                --connect-timeout 5 --max-time 20 "$public_origin/api/ready" &&
               jq -e --arg release "$PREVIOUS_SHA" \
                '.status == "ok" and .service == "oculis-web" and
                 .release == $release' \
                "$HEALTH_RESPONSE_FILE" > /dev/null &&
               jq -e \
                '.status == "ready" and .service == "oculis-web" and
                 .database == "postgresql"' \
                "$READY_RESPONSE_FILE" > /dev/null
            then
              restored=1
              break
            fi
            if (( attempt < 18 )); then
              sleep 5
            fi
          done

          rm -f "$HEALTH_RESPONSE_FILE" "$READY_RESPONSE_FILE"
          if (( restored == 0 )); then
            echo "::error::The rollback command completed, but public rollback acceptance failed."
            exit 1
          fi
          echo "::notice::The previous verified public release was restored after acceptance failed."
          {
            echo "## Automatic rollback"
            echo
            echo "- Restored commit: \`$PREVIOUS_SHA\`"
            echo "- Public health and readiness: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report unavailable safe rollback target
        if: >-
          failure() &&
          steps.deployment_gate.outputs.enabled == 'true' &&
          steps.public_verification.outcome == 'failure' &&
          (steps.previous_release.outputs.sha == '' ||
          steps.previous_release.outputs.sha == steps.release.outputs.sha)
        shell: bash
        run: |
          echo "::error::Public acceptance failed, but no distinct previously verified SHA was available for the wrapper's safe rollback command."
          {
            echo "## Automatic rollback unavailable"
            echo
            echo "No distinct, previously verified public release SHA was available."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report previous verified release still active
        if: >-
          failure() &&
          steps.deployment_gate.outputs.enabled == 'true' &&
          steps.public_verification.outcome == 'failure' &&
          steps.previous_release.outputs.sha != '' &&
          steps.public_verification.outputs.observed_sha == steps.previous_release.outputs.sha
        shell: bash
        env:
          PREVIOUS_SHA: ${{ steps.previous_release.outputs.sha }}
        run: |
          echo "::notice::The requested release was not accepted, but the previous verified release remains healthy; no rollback mutation was necessary."
          {
            echo "## Previous release preserved"
            echo
            echo "- Healthy commit: \`$PREVIOUS_SHA\`"
            echo "- Requested release: not accepted"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral deployment material
        if: always() && steps.deployment_gate.outputs.enabled == 'true'
        shell: bash
        env:
          DEPLOY_KEY_FILE: ${{ runner.temp }}/oculis-vps-deploy-key
          HEALTH_RESPONSE_FILE: ${{ runner.temp }}/oculis-health.json
          READY_RESPONSE_FILE: ${{ runner.temp }}/oculis-ready.json
        run: |
          rm -f \
            "$DEPLOY_KEY_FILE" \
            "$HOME/.ssh/known_hosts" \
            "$HEALTH_RESPONSE_FILE" \
            "$READY_RESPONSE_FILE"

      - name: Record deployment result
        if: success() && steps.deployment_gate.outputs.enabled == 'true'
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
          REMOTE_DEPLOY_OUTCOME: ${{ steps.remote_deploy.outcome }}
        run: |
          {
            echo "## Production VPS deployment"
            echo
            echo "- Commit: \`$DEPLOY_SHA\`"
            if [[ "$REMOTE_DEPLOY_OUTCOME" == "failure" ]]; then
              echo "- SSH transport: reported failure; release accepted by exact public proof"
            else
              echo "- Remote release script: completed"
            fi
            echo "- Public health endpoint: passed"
            echo "- Public readiness endpoint: passed"
          } >> "$GITHUB_STEP_SUMMARY"
